name: Lint

# Controlla la qualità del codice Python a ogni push e pull request.
# Usa Ruff: fa da linter (errori, import inutilizzati, variabili non usate)
# e da formattatore, in un solo strumento e in pochi secondi.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
